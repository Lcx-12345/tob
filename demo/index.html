<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web 预览演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 520px;
    }
    h1 { color: #333; font-size: 28px; margin-bottom: 12px; }
    p { color: #666; line-height: 1.6; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }
    .time {
      margin-top: 24px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Web 预览工具演示</h1>
    <p>这是一个用于演示 web 预览功能的简单页面。<br>服务已成功启动，页面渲染正常。</p>
    <span class="badge" style="margin-left: auto; margin-right: auto; align-self: flex-end; font-weight: bold; text-align: right; position: relative;">服务运行中</span>
    <div class="time" id="time">当前时间：2026/11/7 14:24:08</div>
  </div>
  <script>
    setInterval(() => {
      document.getElementById('time').textContent =
        '当前时间：' + new Date().toLocaleString('zh-CN');
    }, 1000);
  </script>


</body></html>
