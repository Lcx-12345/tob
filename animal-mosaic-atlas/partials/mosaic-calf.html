<svg viewBox="0 0 400 400" width="100%" height="auto" role="img" aria-label="由绿色拼接拼片组成的小牛图案" style="display: block;">
  <defs>
    <clipPath id="calfHeadClip"><polygon points="118,98 146,74 254,74 282,98 282,194 254,218 146,218 118,194"></polygon></clipPath>

    <pattern id="calfTileDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="var(--border-neutral-l2)"></circle>

    <polygon points="222,300 262,300 262,346 222,346" fill="var(--brand-green-800)"></polygon>

    <polygon points="280,120 322,102 332,128 282,152" fill="var(--brand-green-800)"></polygon>

    <g clip-path="url(#calfHeadClip)" stroke-width="4">
