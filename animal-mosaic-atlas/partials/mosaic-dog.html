<svg viewBox="0 0 400 400" width="100%" height="auto" role="img" aria-label="由绿色拼接拼片组成的小狗图案" style="display: block;">
  <defs>
    <clipPath id="dogHeadClip"><polygon points="120,100 148,76 252,76 280,100 280,192 252,216 148,216 120,192"></polygon></clipPath>

    </pattern>
    <pattern id="dogTileDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="var(--border-neutral-l2)"></circle>

    <polygon points="146,292 184,292 184,346 146,346" fill="var(--brand-green-800)"></polygon>
    <polygon points="216,292 254,292 254,346 216,346" fill="var(--brand-green-800)"></polygon>
    <polygon points="140,332 188,332 188,348 140,348" fill="var(--brand-green-400)"></polygon>
    <polygon points="212,332 260,332 260,348 212,348" fill="var(--brand-green-400)"></polygon>

    <polygon points="274,102 312,168 304,214 268,198 258,124" fill="var(--brand-green-800)"></polygon>

    <g clip-path="url(#dogHeadClip)" stroke-width="4">

    <polygon points="156,164 244,164 244,206 224,216 176,216 156,206" fill="var(--brand-green-300)" stroke-width="3"></polygon>
    <polygon points="186,158 214,158 214,174 200,182 186,174" fill="var(--brand-green-900)" stroke-width="3"></polygon>

    <circle cx="164" cy="136" r="13" fill="var(--text-default)"></circle>
    <circle cx="236" cy="136" r="13" fill="var(--text-default)"></circle>

    <circle cx="236" cy="137" r="5" fill="var(--brand-green-900)"></circle>
    <path d="M200 182 V190 M200 190 Q192 196 186 190 M200 190 Q208 196 214 190" fill="none" stroke="var(--brand-green-900)" stroke-width="3" stroke-linecap="round"></path>
