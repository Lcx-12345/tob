<header class="flex flex-wrap items-center justify-between" style="gap: var(--spacer-12); padding: var(--spacer-16) var(--spacer-32); border-bottom: 1px solid var(--border-neutral-l1); background: var(--bg-base-default);">
  <div class="ds-row" style="gap: var(--spacer-8);">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0;">
      <rect x="0" y="0" width="10" height="10" fill="var(--brand-green-500)"></rect>
      <rect x="12" y="0" width="12" height="10" fill="var(--bg-overlay-l4)"></rect>
      <rect x="0" y="12" width="12" height="12" fill="var(--bg-overlay-l4)"></rect>
      <rect x="14" y="12" width="10" height="12" fill="var(--brand-green-700)"></rect>
    </svg>
    <span style="font-size: var(--heading-xs-font-size); font-weight: var(--heading-xs-font-weight); line-height: var(--heading-xs-line-height); color: var(--text-default); letter-spacing: -0.01em;">看图识动物</span>
    <span class="ds-tag">拼接图谱</span>
  </div>
  <div class="ds-row" style="gap: var(--spacer-12);">
    <span style="font-family: var(--code-editor-font-family); font-size: var(--body-xs-font-size); color: var(--text-tertiary);">POLY-TILE / 73</span>
    <span class="ds-tag ds-tag--brand"><span style="width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; display: inline-block; margin-right: 6px;"></span>3 种动物</span>
  </div>
</header>
