<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   小蚂蚁画布 · 主题色与字体
   品牌前缀: ant
   色彩方向: 奶油暖底 + 暖赭陶土主色（大地色系，单一品牌色相）
   ============================================================ */

:root {
  /* —— 品牌主色（唯一品牌色相：暖赭陶土）—— */
  --ant-primary: #b4552d;
  --ant-primary-foreground: #fff8f2;

  /* —— 中性表面（奶油暖底）—— */
  --ant-background: #faf6ef;
  --ant-foreground: #3b2a20;
  --ant-card: #fffdf9;
  --ant-card-foreground: #3b2a20;
  --ant-popover: #fffdf9;
  --ant-popover-foreground: #3b2a20;
  --ant-muted: #f1e8db;
  --ant-muted-foreground: #85705f;

  /* —— 边框与控件 —— */
  --ant-border: #e8dccb;
  --ant-input: #e8dccb;
  --ant-ring: #b4552d;

  /* —— 圆角体系 —— */
  --ant-radius-sm: 4px;
  --ant-radius-md: 8px;
  --ant-radius-lg: 16px;

  /* —— 扩展墨色层级与表面 —— */
  --ant-ink-2: #6e5a4b;
  --ant-ink-3: #9c8878;
  --ant-surface-2: #f6efe4;
  --ant-line: #e8dccb;

  /* —— 阴影（静态卡片仅用极浅阴影，深阴影 reserved for 浮层）—— */
  --ant-shadow-1: 0 1px 2px rgba(59, 42, 32, 0.05), 0 1px 1px rgba(59, 42, 32, 0.03);
  --ant-shadow-2: 0 8px 24px -8px rgba(59, 42, 32, 0.16);

  /* —— 字体（中文无衬线默认栈）—— */
  --ant-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ant-background);
    --color-foreground: var(--ant-foreground);
    --color-card: var(--ant-card);
    --color-card-foreground: var(--ant-card-foreground);
    --color-popover: var(--ant-popover);
    --color-popover-foreground: var(--ant-popover-foreground);
    --color-primary: var(--ant-primary);
    --color-primary-foreground: var(--ant-primary-foreground);
    --color-muted: var(--ant-muted);
    --color-muted-foreground: var(--ant-muted-foreground);
    --color-border: var(--ant-border);
    --color-input: var(--ant-input);
    --color-ring: var(--ant-ring);
    --radius-sm: var(--ant-radius-sm);
    --radius-md: var(--ant-radius-md);
    --radius-lg: var(--ant-radius-lg);
  }
  @layer base {
    body { background: var(--ant-background); color: var(--ant-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
