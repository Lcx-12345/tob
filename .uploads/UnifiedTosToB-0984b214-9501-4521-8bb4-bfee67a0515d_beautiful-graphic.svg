<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 400 300" 
     width="400" 
     height="300">
  
  <!-- 定义渐变和滤镜 -->
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 圆形渐变 -->
    <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </radialGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- 装饰性背景圆 -->
  <circle cx="50" cy="50" r="80" fill="#ffffff10"/>
  <circle cx="380" cy="280" r="100" fill="#ffffff08"/>
  
  <!-- 主要装饰图形组 -->
  <g filter="url(#shadow)">
    <!-- 中心大圆 -->
    <circle cx="200" cy="150" r="60" fill="url(#circleGradient)" opacity="0.9"/>
    
    <!-- 环绕的小圆 -->
    <circle cx="200" cy="70" r="20" fill="#4facfe" opacity="0.8"/>
    <circle cx="280" cy="110" r="15" fill="#00f2fe" opacity="0.8"/>
    <circle cx="300" cy="180" r="18" fill="#43e97b" opacity="0.8"/>
    <circle cx="260" cy="240" r="22" fill="#38f9d7" opacity="0.8"/>
    <circle cx="140" cy="240" r="16" fill="#fa709a" opacity="0.8"/>
    <circle cx="100" cy="170" r="20" fill="#fee140" opacity="0.8"/>
    <circle cx="120" cy="90" r="14" fill="#a8edea" opacity="0.8"/>
  </g>
  
  <!-- 连接线 -->
  <g stroke="#ffffff40" stroke-width="1.5" fill="none">
    <line x1="200" y1="90" x2="200" y2="70"/>
    <line x1="250" y1="120" x2="280" y2="110"/>
    <line x1="260" y1="170" x2="300" y2="180"/>
    <line x1="240" y1="200" x2="260" y2="240"/>
    <line x1="160" y1="200" x2="140" y2="240"/>
    <line x1="150" y1="160" x2="100" y2="170"/>
    <line x1="160" y1="110" x2="120" y2="90"/>
  </g>
  
  <!-- 中心图标 - 星形 -->
  <g transform="translate(200, 150)" filter="url(#glow)">
    <polygon points="0,-25 7,-8 25,-8 11,3 17,22 0,12 -17,22 -11,3 -25,-8 -7,-8" 
             fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- 标题文字 -->
  <text x="200" y="280" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.9">
    SVG 示例图形
  </text>
  
  <!-- 装饰性小点 -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="30" cy="150" r="2"/>
    <circle cx="370" cy="100" r="2"/>
    <circle cx="350" cy="50" r="1.5"/>
    <circle cx="60" cy="250" r="2"/>
    <circle cx="320" cy="250" r="1.5"/>
  </g>
</svg>